<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Gestão de Obras</title>
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="login-fundo">
    <div class="login-card">
      <img src="assets/img/logo_login.png" alt="Logo" class="login-logo">
      <h1>Acesso ao Sistema</h1>

      <!-- Etapa 1: login -->
      <form id="form-login">
        <label for="usuario">Usuário (e-mail)</label>
        <input type="email" id="usuario" placeholder="seu@email.com" required autocomplete="username">

        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="••••••••" autocomplete="current-password">

        <p id="login-erro" class="login-erro"></p>
        <button type="submit" class="btn">Entrar</button>
      </form>

      <!-- Etapa 2: definir senha no primeiro acesso -->
      <form id="form-definir-senha" style="display:none;">
        <p style="text-align:center;color:#c9d6e8;margin-bottom:18px;">Primeiro acesso: defina sua senha para continuar.</p>

        <label for="nova-senha-login">Nova senha</label>
        <input type="password" id="nova-senha-login" autocomplete="new-password">

        <label for="confirmar-senha-login">Confirmar senha</label>
        <input type="password" id="confirmar-senha-login" autocomplete="new-password">

        <p id="senha-erro" class="login-erro"></p>
        <button type="submit" class="btn">Salvar e entrar</button>
      </form>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
